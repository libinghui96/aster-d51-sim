name: Simulate & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # enables pipefail so `| grep -v` doesn't hide python failures
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system OpenGL (OSMesa)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install Python deps
        run: pip install mujoco numpy matplotlib pillow

      - name: Check model is in sync with generator
        run: |
          python scripts/03_generate_mjcf.py --out /tmp/d51_regen.xml
          diff -q /tmp/d51_regen.xml models/d51_full.xml

      - name: Headless test-run demo (telemetry plot)
        run: python -m sim.run_cosim --headless-demo --out-plot site/d51_telemetry.png 2>&1 | grep -v '^WARNING'

      - name: Render running animation
        run: python scripts/04_render_animation.py --out site/d51_running.gif 2>&1 | grep -v '^WARNING'

      - name: Build page
        run: |
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="zh">
          <head><meta charset="utf-8"><title>Aster D51 co-simulation</title>
          <style>body{font-family:sans-serif;background:#111;color:#ddd;max-width:1100px;margin:2em auto;padding:0 1em}img{max-width:100%;border:1px solid #333}</style>
          </head>
          <body>
          <h1>Aster D51 1D 热力学 + MuJoCo 联合仿真</h1>
          <p>commit <code>${GITHUB_SHA::7}</code>, built $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <h2>滚轮台热炉运转 (4x 慢放)</h2>
          <img src="d51_running.gif" alt="running animation">
          <h2>试运转全流程遥测</h2>
          <img src="d51_telemetry.png" alt="telemetry">
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: simulate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
