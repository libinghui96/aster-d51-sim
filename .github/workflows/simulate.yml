name: Simulate & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # enables pipefail so `| grep -v` doesn't hide python failures
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install system OpenGL (OSMesa)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install Python deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco numpy matplotlib pillow scipy

      - name: Sync CAD/MJCF assets & build Web 3D interactive frontend
        run: |
          python scripts/05_sync_web_assets.py
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p site
          cp -r web/dist/. site/
          touch site/.nojekyll

      - name: Check models are in sync with generator & run Gates 1-24 verification
        run: |
          python scripts/03_generate_mjcf.py --mode roller --out /tmp/d51_regen.xml
          diff -q /tmp/d51_regen.xml models/d51_full.xml
          python scripts/03_generate_mjcf.py --mode track --out /tmp/d51_track_regen.xml
          diff -q /tmp/d51_track_regen.xml models/d51_track.xml
          python scripts/03_generate_mjcf.py --mode curve_r2m --out /tmp/d51_r2m_regen.xml
          diff -q /tmp/d51_r2m_regen.xml models/d51_r2m.xml
          python scripts/09_verify_cad_and_clearance.py

      - name: Headless test-run demo (telemetry plot)
        run: python -m sim.run_cosim --headless-demo --out-plot site/d51_telemetry.png 2>&1 | grep -v '^WARNING'

      - name: Render running animation
        run: python scripts/04_render_animation.py --out site/d51_running.gif 2>&1 | grep -v '^WARNING'

      - name: Build CI telemetry report page
        run: |
          cat > site/report.html <<EOF
          <!doctype html>
          <html lang="zh">
          <head><meta charset="utf-8"><title>Aster D51 CI Telemetry Report</title>
          <style>body{font-family:sans-serif;background:#111;color:#ddd;max-width:1100px;margin:2em auto;padding:0 1em}img{max-width:100%;border:1px solid #333}a.btn{display:inline-block;background:#b85c00;color:#fff;text-decoration:none;padding:8px 14px;border-radius:6px;font-weight:600}</style>
          </head>
          <body>
          <h1>Aster D51 STEP-First 104件 3D 多相热流/热弹塑性 + 7-PINO + MuJoCo 轮轨联合仿真 CI 报告</h1>
          <p><a class="btn" href="./">打开 Web 3D 实时交互数字孪生</a></p>
          <p>commit <code>${GITHUB_SHA::7}</code>, built $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <h2>滚轮台热炉运转 (4x 慢放)</h2>
          <img src="d51_running.gif" alt="running animation">
          <h2>试运转全流程遥测</h2>
          <img src="d51_telemetry.png" alt="telemetry">
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: simulate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
